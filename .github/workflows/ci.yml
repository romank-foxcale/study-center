name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  core-tests:
    name: Core tests (Python ${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: plugins/mentor/core
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: plugins/mentor/core/uv.lock
      - name: Install
        run: uv sync --locked --python ${{ matrix.python }}
      - name: Test
        run: uv run --python ${{ matrix.python }} pytest -q

  plugin-validate:
    name: Validate plugin and marketplace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate plugin
        run: claude plugin validate plugins/mentor
      - name: Validate marketplace
        run: claude plugin validate .
