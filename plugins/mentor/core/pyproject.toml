[project]
name = "mentor-core"
version = "0.1.0"
description = "Provider-agnostic core for the Mentor tutor: knowledge graph, mastery, spaced review, rendering"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "fsrs>=6.3,<7",
    "networkx>=3.3",
    "pyyaml>=6.0",
    "mcp>=2.3,<3",
    "markdown-it-py>=3.0",
    "mdit-py-plugins>=0.4",
    "jinja2>=3.1",
    "sympy>=1.13",
    "genanki>=0.13",
]

[project.scripts]
mentor = "mentor_core.cli:main"
mentor-mcp = "mentor_core.mcp_server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mentor_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
